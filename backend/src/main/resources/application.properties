spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kind_wardrobe}
spring.datasource.username=${DB_USER:kind_wardrobe}
spring.datasource.password=${DB_PASSWORD:kind_wardrobe}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# --- JWT ---
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.jwt.issuer=kind-wardrobe
app.jwt.access-token-ttl=1h
